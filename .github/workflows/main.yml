name: Build KoshPay APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip Project
        run: |
          ls -la
          unzip -o "koshpay-digital-finance-android-apk-project (1).zip" -d extracted
          ls -la extracted
          if [ -f "extracted/package.json" ]; then cp -r extracted/* .; else cp -r extracted/*/* .; fi
          ls -la
          cat package.json

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KoshPay-App-Release-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
